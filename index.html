<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>front-end</title>
    <script>
      (() => {
        const systemTheme = () =>
          matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";

        const setTheme = (theme) => {
          if (theme === "system") {
            localStorage.removeItem("theme");
            document.documentElement.setAttribute("data-theme", systemTheme());
            document.documentElement.setAttribute(
              "data-theme-source",
              "system",
            );
          } else {
            localStorage.setItem("theme", theme);
            document.documentElement.setAttribute("data-theme", theme);
            document.documentElement.setAttribute("data-theme-source", "user");
          }
        };

        if (!document.documentElement.hasAttribute("data-theme")) {
          setTheme(localStorage.getItem("theme") || "system");
        }

        window.addEventListener(
          "storage",
          (e) => e.key === "theme" && setTheme(e.newValue || "system"),
        );

        document.addEventListener("DOMContentLoaded", () => {
          document.querySelectorAll("button[data-theme]").forEach((el) => {
            el.addEventListener("click", () => {
              setTheme(el.dataset.theme);
            });
          });
        });

        matchMedia("(prefers-color-scheme: dark)").addEventListener(
          "change",
          (e) => {
            if (
              document.documentElement.getAttribute("data-theme-source") ===
              "system"
            ) {
              document.documentElement.setAttribute(
                "data-theme",
                systemTheme(),
              );
            }
          },
        );
      })();
    </script>
  </head>
  <body>
    <div
      id="app"
      class="w-screen h-screen bg-base-light dark:bg-base-dark text-base-dark dark:text-base-light"
    >
      <nav class="bg-bold-light dark:bg-bold-dark w-full h-15 flex flex-row justify-between items-center">
        <span class="font-bold font-sansation-bold">TechFlow</span>

        <div
          class="relative flex flex-row items-center rounded-full border-2 border-bold-light bg-base-light dark:border-bold-dark dark:bg-base-dark"
        >
          <div
            class="absolute left-0 h-full w-1/3 rounded-full border border-base-dark dark:border-base-light brightness-200 transition-[left] in-data-[theme=light]:left-1/3 in-data-[theme=dark]:left-2/3 in-data-[theme-source=system]:left-0!"
          ></div>

          <!-- System -->
          <button
            type="button"
            class="flex w-1/3 cursor-pointer p-2"
            data-theme="system"
            aria-label="System theme"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 16 16"
              fill="currentColor"
              class="size-4 opacity-75 hover:opacity-100"
              aria-hidden="true"
            >
              <path
                fill-rule="evenodd"
                clip-rule="evenodd"
                d="M2 4.25A2.25 2.25 0 0 1 4.25 2h7.5A2.25 2.25 0 0 1 14 4.25v5.5A2.25 2.25 0 0 1 11.75 12h-1.312c.1.128.21.248.328.36a.75.75 0 0 1 .234.545v.345a.75.75 0 0 1-.75.75h-4.5a.75.75 0 0 1-.75-.75v-.345a.75.75 0 0 1 .234-.545c.118-.111.228-.232.328-.36H4.25A2.25 2.25 0 0 1 2 9.75v-5.5Zm2.25-.75a.75.75 0 0 0-.75.75v4.5c0 .414.336.75.75.75h7.5a.75.75 0 0 0 .75-.75v-4.5a.75.75 0 0 0-.75-.75h-7.5Z"
              />
            </svg>
          </button>

          <!-- Light -->
          <button
            type="button"
            class="flex w-1/3 cursor-pointer p-2"
            data-theme="light"
            aria-label="Light theme"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 16 16"
              fill="currentColor"
              class="size-4 opacity-75 hover:opacity-100"
              aria-hidden="true"
            >
              <path
                d="M8 1a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0v-1.5A.75.75 0 0 1 8 1ZM10.5 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0ZM12.95 4.11a.75.75 0 1 0-1.06-1.06l-1.062 1.06a.75.75 0 0 0 1.061 1.062l1.06-1.061ZM15 8a.75.75 0 0 1-.75.75h-1.5a.75.75 0 0 1 0-1.5h1.5A.75.75 0 0 1 15 8ZM11.89 12.95a.75.75 0 0 0 1.06-1.06l-1.06-1.062a.75.75 0 0 0-1.062 1.061l1.061 1.06ZM8 12a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0v-1.5A.75.75 0 0 1 8 12ZM5.172 11.89a.75.75 0 0 0-1.061-1.062L3.05 11.89a.75.75 0 1 0 1.06 1.06l1.06-1.06ZM4 8a.75.75 0 0 1-.75.75h-1.5a.75.75 0 0 1 0-1.5h1.5A.75.75 0 0 1 4 8ZM4.11 5.172A.75.75 0 0 0 5.173 4.11L4.11 3.05a.75.75 0 1 0-1.06 1.06l1.06 1.06Z"
              />
            </svg>
          </button>

          <!-- Dark -->
          <button
            type="button"
            class="flex w-1/3 cursor-pointer p-2"
            data-theme="dark"
            aria-label="Dark theme"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 16 16"
              fill="currentColor"
              class="size-4 opacity-75 hover:opacity-100"
              aria-hidden="true"
            >
              <path
                d="M14.438 10.148c.19-.425-.321-.787-.748-.601A5.5 5.5 0 0 1 6.453 2.31c.186-.427-.176-.938-.6-.748a6.501 6.501 0 1 0 8.585 8.586Z"
              />
            </svg>
          </button>
        </div>
      </nav>

      <aside></aside>

      <main class="font-dm-mono-light">teste</main>

      <footer></footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
